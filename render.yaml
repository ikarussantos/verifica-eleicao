# Configuração do servidor (backend) no Render: https://render.com
services:
  - type: web
    name: verifica-eleicao-api
    runtime: node
    plan: free
    rootDir: verifica-eleicao-mvp/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.1-flash-lite
      - key: GEMINI_WEB_SEARCH
        value: "false"
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
